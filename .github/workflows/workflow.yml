on:
    push:
    workflow_dispatch:

env:
    NSUnbufferedIO: YES

defaults:
    run:
        shell: bash

jobs:
    job:
        runs-on: macos-26
        steps:
            - uses: maxim-lobanov/setup-xcode@master
              with:
                xcode-version: "26.6.0"

            - run: |
                echo 'import Foundation;assert(dlopen("/System/Library/Frameworks/SwiftUI.framework/SwiftUI", RTLD_NOW) != nil);print("_NSSwiftUICoreFeatureFlags: \(NSClassFromString("_NSSwiftUICoreFeatureFlags").debugDescription)");print("_NSSolarium: \(NSClassFromString("_NSSolarium").debugDescription)")' | swift repl
